<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <link rel="icon" type="image/png" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- theme_color tambien aqui: pinta la barra del navegador antes de que
         el manifest termine de descargarse. -->
    <meta name="theme-color" content="#0d9488" />
    <meta
      name="description"
      content="Gestion integral de la clinica veterinaria: clientes, pacientes, historial clinico y turnos."
    />

    <!-- iOS ignora buena parte del manifest; estas etiquetas son las que
         hacen que la app se abra sin la barra de Safari al agregarla al
         inicio. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="VetClinic" />

    <title>VetClinic - Gestion Veterinaria</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
